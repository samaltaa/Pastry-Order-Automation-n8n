[project]
name = "sync-api"
version = "0.1.0"
description = "Keeps a point-of-sale database in sync with Shopify"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.159",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.3",
  "pydantic-settings>=2.16",
  "anthropic>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
