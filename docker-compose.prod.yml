x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  ops-api:
    build:
      context: .
      dockerfile: ops-api/Dockerfile
    image: pastry-ops-api:latest
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Waits for ops-api, which applies all database migrations (including the sync schema).
  sync-api:
    build:
      context: .
      dockerfile: sync-api/Dockerfile
    image: pastry-sync-api:latest
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      ops-api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  n8n:
    image: n8nio/n8n:1.76.1
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: America/Santo_Domingo
      NODE_ENV: production
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      ops-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    logging: *logging
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      STATUS_DOMAIN: ${STATUS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - uptime-kuma
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  postgres_data:
  n8n_data:
  uptime_kuma_data:
  caddy_data:
  caddy_config:
